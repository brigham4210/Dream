<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Closet</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e9e6; color: #1c1d1f;
               font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  canvas { display: block; touch-action: none; cursor: grab; }
  #head { position: fixed; left: 24px; top: 20px; }
  #head b { display: block; font-size: 13px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; }
  #head span { display: block; margin-top: 5px; font-size: 12px; letter-spacing: .06em; opacity: .55; }
  #head a { display: inline-block; margin-top: 10px; font-size: 12px; color: inherit; opacity: .6; text-decoration: none; }
  #head a:hover { opacity: 1; }
  #hint { position: fixed; right: 24px; top: 22px; font-size: 12px; opacity: .5; pointer-events: none; text-align: right; line-height: 1.5; }
  #dock { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; width: max-content; max-width: calc(100vw - 24px); }
  #tabs, #card { background: rgba(255,255,255,.78); backdrop-filter: blur(14px); box-shadow: 0 6px 24px rgba(0,0,0,.14); }
  #tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 6px; border-radius: 24px; }
  button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 8px 15px; border-radius: 999px; border: 0; background: transparent; color: inherit; cursor: pointer; white-space: nowrap; }
  button:hover { background: rgba(0,0,0,.07); }
  button.on, #back { background: #1c1d1f; color: #fff; }
  button:focus-visible { outline: 2px solid #1c1d1f; outline-offset: 2px; }
  #card { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 6px; border-radius: 999px; max-width: 100%; box-sizing: border-box; }
  #card[hidden] { display: none; }
  #card button { flex: none; padding: 7px 12px; }
  #line { min-width: 0; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #line b { font-weight: 600; } #line span { opacity: .65; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 30px; text-align: center; color: #600; }
  @media (max-width: 640px) { #hint { display: none; } #head { left: 16px; top: 14px; } #line span { display: none; } }
</style>
<!-- clothes.js is the list of what hangs here; garments.js cuts each piece; wardrobe.js is the furniture and the room. -->
<script src="clothes.js"></script>
<script src="garments.js"></script>
<script src="wardrobe.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="head"><b>My Closet</b><span id="count"></span><a href="../">‹ Dream</a></div>
<div id="hint">Drag to look around · scroll to zoom<br>Click a piece to take it off the rail</div>
<div id="dock">
  <div id="card" hidden><button id="prev" aria-label="Previous piece">‹</button><div id="line"><b id="name"></b> <span id="note"></span></div><button id="next" aria-label="Next piece">›</button><button id="back">Put back</button></div>
  <div id="tabs"></div>
</div>
<div id="err">Could not load three.js – this page needs an internet connection when it is opened.</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const CLOTHES = window.DREAM_CLOTHES || [];

const pxRatio = () => Math.max(1, Math.min(devicePixelRatio * 1.5, 3, Math.sqrt(1.1e7 / Math.max(1, innerWidth * innerHeight))));
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(pxRatio());
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{ const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; pm.dispose(); scene.environmentIntensity = 0.55; }
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8479, 0.5));
const sun = new THREE.DirectionalLight(0xfff6ea, 2.1);
sun.position.set(2.2, 4.2, 7); sun.target.position.set(0, 1.2, 0); scene.add(sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -3.4, right: 3.4, top: 2.4, bottom: -2.4, near: 1, far: 16 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.01; sun.shadow.radius = 5;
scene.add(sun);

const closet = window.buildCloset({ THREE, scene, renderer });

// hang the clothes: each rail's pieces are spread along it, turned so their fronts show
const ease = t => t * t * (3 - 2 * t), tmp = new THREE.Vector3();
const tailor = window.makeTailor(THREE), OUT_Y = 1.88, OUT_Z = 1.3, SLIDE = 0.9;
const pieces = CLOTHES.map(item => ({ item, ...tailor(item), v: 0, t: 0 }));
for (const [name, r] of Object.entries(closet.rails)) {
  const on = pieces.filter(p => p.rail === name);
  on.forEach((p, i) => {
    p.fan = r.fan; p.home = new THREE.Vector3(on.length > 1 ? r.x0 + (r.x1 - r.x0) * i / (on.length - 1) : (r.x0 + r.x1) / 2, r.y, 0);
    p.out = new THREE.Vector3(p.home.x * 0.55, OUT_Y, OUT_Z);
    scene.add(p.root); place(p);
  });
}
// taking a piece out: first it slides out of the row edge-on (v 0 to 0.5), then it comes forward and turns to face the room
function place(p) {
  const a = ease(Math.min(1, p.v * 2)), b = ease(Math.max(0, p.v * 2 - 1)), s = Math.sign(p.fan);
  tmp.set(p.home.x - s * Math.cos(p.fan) * SLIDE * a, p.home.y + 0.035 * Math.sin(Math.PI * Math.min(1, a * 2.5) / 2), Math.abs(Math.sin(p.fan)) * SLIDE * a);
  p.root.position.lerpVectors(tmp, p.out, b); p.root.rotation.y = p.fan * (1 - b);
}

// camera: the whole wardrobe, one group on its rail, or one piece held out
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight || 1.6, 0.05, 80);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 0.6; controls.maxDistance = 22; controls.maxPolarAngle = Math.PI / 2 - 0.02;
const groups = [...new Set(CLOTHES.map(c => c.group))];
const tall = () => Math.max(1, 0.9 / camera.aspect);
let goal = null, focus = -1, tab = -1;
function view() {
  if (focus >= 0) { const p = pieces[focus], t = new THREE.Vector3(p.out.x, p.out.y - p.length / 2 - 0.1, p.out.z); return { target: t, cam: t.clone().add(new THREE.Vector3(0.3, 0.05, (1.75 + p.length * 2.1) * tall())) }; }
  if (tab >= 0) { const on = pieces.filter(p => p.item.group === groups[tab]), box = new THREE.Box3();
    for (const p of on) { box.expandByPoint(p.home); box.expandByPoint(tmp.set(p.home.x, p.home.y - p.length, 0)); }
    const t = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3()), d = (1.3 + Math.max(s.y * 1.9, s.x * 1.5)) * tall(), side = Math.sign(on.reduce((n, p) => n + p.fan, 0));
    return { target: t, cam: t.clone().add(new THREE.Vector3(side * 0.42 * d, 0.1 * d, 0.9 * d)) }; }
  const d = 6.9 * tall(); return { target: new THREE.Vector3(0, 1.22, 0), cam: new THREE.Vector3(0.14 * d, 1.22 + 0.06 * d, d) };
}
controls.addEventListener('start', () => { goal = null; });

// the dock
const $ = id => document.getElementById(id), tabs = $('tabs');
$('count').textContent = `${CLOTHES.length} piece${CLOTHES.length === 1 ? '' : 's'}`;
const btns = [['Everything', -1], ...groups.map((g, i) => [g, i])].map(([label, i]) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { tab = i; select(-1); }; tabs.appendChild(b); return b; });
function select(i) {
  focus = i; if (i >= 0) tab = groups.indexOf(pieces[i].item.group);
  pieces.forEach((p, k) => { p.t = k === i ? 1 : 0; });
  btns.forEach((b, k) => b.classList.toggle('on', k - 1 === tab));
  $('card').hidden = i < 0;
  if (i >= 0) { $('name').textContent = pieces[i].item.name; $('note').textContent = '· ' + pieces[i].item.note; }
  goal = view();
}
const step = d => select((Math.max(focus, d > 0 ? -1 : 0) + d + pieces.length) % pieces.length);
$('prev').onclick = () => step(-1); $('next').onclick = () => step(1); $('back').onclick = () => select(-1);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'Escape') select(-1); });

// clicking a piece takes it out; clicking it again puts it back
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), canvas = renderer.domElement, roots = pieces.map(p => p.root);
function pick(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set((ev.clientX - r.left) / r.width * 2 - 1, -((ev.clientY - r.top) / r.height * 2 - 1));
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects([...roots, closet.unit], true)[0];
  for (let o = h && h.object; o; o = o.parent) { const k = roots.indexOf(o); if (k >= 0) return k; }
  return -1;
}
let down = null, lastHover = 0;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 600) { const k = pick(e); if (k >= 0) select(k === focus ? -1 : k); }
  down = null;
});
canvas.addEventListener('pointermove', e => { if (e.buttons || performance.now() - lastHover < 90) return; lastHover = performance.now(); canvas.style.cursor = pick(e) >= 0 ? 'pointer' : 'grab'; });

const reset = () => { const v = view(); camera.position.copy(v.cam); controls.target.copy(v.target); };
const fit = () => { camera.aspect = innerWidth / innerHeight || 1.6; camera.updateProjectionMatrix(); renderer.setPixelRatio(pxRatio()); renderer.setSize(innerWidth, innerHeight); if (!isFinite(camera.position.x + camera.position.y + camera.position.z)) reset(); };
addEventListener('resize', fit); fit(); reset(); btns[0].classList.add('on');

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const p of pieces) if (Math.abs(p.t - p.v) > 1e-4) { p.v += (p.t - p.v) * Math.min(1, dt * 3.6); if (Math.abs(p.t - p.v) < 2e-3) p.v = p.t; place(p); }
  if (goal) { controls.target.lerp(goal.target, 0.08); camera.position.lerp(goal.cam, 0.08); if (camera.position.distanceTo(goal.cam) < 0.01) goal = null; }
  controls.update();
  renderer.render(scene, camera);
});
window.__closet = { pieces, camera, controls, renderer, scene, select, THREE };
</script>
<script>
  addEventListener('error', e => { if (!document.querySelector('canvas')) document.getElementById('err').style.display = 'flex'; }, true);
</script>
</body>
</html>
