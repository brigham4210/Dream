<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dream Garage</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e9e6; color: #1c1d1f;
               font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  canvas { display: block; touch-action: none; cursor: grab; }
  #head { position: fixed; left: 24px; top: 20px; pointer-events: none; }
  #head b { display: block; font-size: 13px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; }
  #head span { display: block; margin-top: 5px; font-size: 12px; letter-spacing: .06em; opacity: .55; }
  #hint { position: fixed; right: 24px; top: 22px; font-size: 12px; opacity: .5; pointer-events: none; text-align: right; line-height: 1.5; }
  #dock { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: calc(100vw - 24px); }
  #tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 6px; border-radius: 999px; background: rgba(255,255,255,.78); backdrop-filter: blur(14px); box-shadow: 0 6px 24px rgba(0,0,0,.14); }
  #tabs button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 8px 15px; border-radius: 999px; border: 0; background: transparent; color: inherit; cursor: pointer; white-space: nowrap; }
  #tabs button:hover { background: rgba(0,0,0,.07); }
  #tabs button.on { background: #1c1d1f; color: #fff; }
  #tabs button:focus-visible, #card a:focus-visible { outline: 2px solid #1c1d1f; outline-offset: 2px; }
  #card { display: flex; align-items: center; gap: 16px; font-size: 12px; padding: 7px 8px 7px 18px; border-radius: 999px; background: rgba(255,255,255,.78); backdrop-filter: blur(14px); box-shadow: 0 6px 24px rgba(0,0,0,.14); max-width: 100%; box-sizing: border-box; }
  #card[hidden] { display: none; }
  #card span { opacity: .7; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #card a { flex: none; font-weight: 600; color: #fff; background: #1c1d1f; text-decoration: none; padding: 7px 14px; border-radius: 999px; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 30px; text-align: center; color: #600; }
  @media (max-width: 640px) { #hint { display: none; } #head { left: 16px; top: 14px; } }
</style>
<!-- One line per car: each script adds its car to the garage, in this order. -->
<script src="mini.car.js"></script>
<script src="c10.car.js"></script>
<script src="showroom.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="head"><b>My Dream Garage</b><span id="count"></span></div>
<div id="hint">Drag to walk around · scroll to zoom<br>Click a door, bonnet or hood, boot or tailgate</div>
<div id="dock">
  <div id="card" hidden><span id="line"></span><a id="open">Full viewer →</a></div>
  <div id="tabs"></div>
</div>
<div id="err">Could not load three.js – this page needs an internet connection when it is opened.</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const CARS = window.DREAM_CARS || [];
const SPACING = 3.9, ANGLE = -Math.PI / 2 - 15 * Math.PI / 180;   // parked side by side, noses out into the room, each turned 15° towards the left wall

const pxRatio = () => Math.max(1, Math.min(devicePixelRatio * 1.5, 3, Math.sqrt(1.1e7 / Math.max(1, innerWidth * innerHeight))));
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(pxRatio());
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.7;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{ const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; pm.dispose(); }   // replaced by the room itself below
scene.add(new THREE.HemisphereLight(0xffffff, 0x77786f, 0.12));
const half = (CARS.length - 1) / 2 * SPACING, reach = half + 4;
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(1.6, 7, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -reach, right: reach, top: 4.5, bottom: -4.5, near: 1, far: 16 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.012; sun.shadow.radius = 5;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.62 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// park the cars
const parked = CARS.map((entry, i) => {
  const root = new THREE.Group();
  root.position.set(i * SPACING - half, 0, 0.1); root.rotation.y = ANGLE;
  scene.add(root);
  const { car, parts } = entry.build({ THREE, mergeVertices, scene: root });
  for (const k in parts) Object.assign(parts[k], { v: 0, t: 0 });
  return { entry, root, car, parts };
});
window.buildShowroom({ THREE, Reflector, scene, renderer, cars: parked.map(p => ({ object: p.root, info: p.entry.info, x: p.root.position.x })) });

// camera: an overview of the whole row, or close on one car
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight || 1.6, 0.05, 120);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 1.2; controls.maxDistance = 40 + half * 4; controls.maxPolarAngle = Math.PI / 2 - 0.02;
const overview = () => { const d = (8.2 + half * 1.7) * Math.max(1, 1.5 / camera.aspect); return { target: new THREE.Vector3(0.3, 0.8, 0), cam: new THREE.Vector3(0.3 + 0.42 * d, 0.26 * d + 0.6, 0.92 * d) }; };
const closeUp = p => { const k = p.entry.size * Math.max(1, 1.35 / camera.aspect), t = new THREE.Vector3(p.root.position.x, 0.75, p.root.position.z); return { target: t, cam: t.clone().add(new THREE.Vector3(3.6 * k, 1.1 * k + 0.2, 5.2 * k)) }; };
let goal = null, focus = -1;
const view = () => focus < 0 ? overview() : closeUp(parked[focus]);
controls.addEventListener('start', () => { goal = null; });

// the dock
const $ = id => document.getElementById(id), tabs = $('tabs');
$('count').textContent = `${CARS.length} car${CARS.length === 1 ? '' : 's'}`;
const short = n => n.replace(/^\d{4}\s+/, '').split(' ').slice(0, 2).join(' ');
const btns = [['All cars', -1], ...parked.map((p, i) => [short(p.entry.name), i])].map(([label, i]) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => select(i); tabs.appendChild(b); return b; });
function select(i) {
  focus = i; goal = view();
  btns.forEach((b, k) => b.classList.toggle('on', k - 1 === i));
  $('card').hidden = i < 0;
  if (i >= 0) { const e = parked[i].entry; $('line').textContent = `${e.name} · ${e.line}`; $('open').href = encodeURI(e.file); }
}
btns[0].classList.add('on');
addEventListener('keydown', e => { if (e.key === 'ArrowRight') select(Math.min(parked.length - 1, focus + 1)); else if (e.key === 'ArrowLeft') select(Math.max(-1, focus - 1)); });

// clicking a door, bonnet, hood, boot or tailgate
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tmp = new THREE.Vector3(), canvas = renderer.domElement, roots = parked.map(p => p.root);
function pick(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set((ev.clientX - r.left) / r.width * 2 - 1, -((ev.clientY - r.top) / r.height * 2 - 1));
  ray.setFromCamera(ndc, camera);
  for (const h of ray.intersectObjects(roots, true)) {
    const o = h.object;
    if (!o.userData.proxy) { let vis = true; for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; } if (!vis) continue; }
    if (o.userData.mask && !o.userData.mask(o.worldToLocal(tmp.copy(h.point)))) continue;
    let action = null, owner = null;
    for (let p = o; p; p = p.parent) { if (!action && p.userData.action) action = p.userData.action; const k = roots.indexOf(p); if (k >= 0) owner = parked[k]; }
    return action && owner ? { owner, action } : null;
  }
  return null;
}
let down = null, lastHover = 0;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 600) { const a = pick(e); if (a) { const p = a.owner.parts[a.action]; p.t = p.t ? 0 : 1; } }
  down = null;
});
canvas.addEventListener('pointermove', e => { if (e.buttons || performance.now() - lastHover < 90) return; lastHover = performance.now(); canvas.style.cursor = pick(e) ? 'pointer' : 'grab'; });

const reset = () => { const v = view(); camera.position.copy(v.cam); controls.target.copy(v.target); };
const fit = () => { camera.aspect = innerWidth / innerHeight || 1.6; camera.updateProjectionMatrix(); renderer.setPixelRatio(pxRatio()); renderer.setSize(innerWidth, innerHeight); if (!isFinite(camera.position.x + camera.position.y + camera.position.z)) reset(); };
addEventListener('resize', fit); fit(); reset();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const { parts } of parked) for (const k in parts) { const p = parts[k]; if (Math.abs(p.t - p.v) > 1e-4) { p.v += (p.t - p.v) * Math.min(1, dt * 5); if (Math.abs(p.t - p.v) < 2e-3) p.v = p.t; p.set(p.v); } }
  if (goal) { controls.target.lerp(goal.target, 0.1); camera.position.lerp(goal.cam, 0.1); if (camera.position.distanceTo(goal.cam) < 0.01) goal = null; }
  controls.update();
  renderer.render(scene, camera);
});
window.__garage = { parked, camera, controls, renderer, scene, select, THREE };
</script>
<script>
  addEventListener('error', e => { if (!document.querySelector('canvas')) document.getElementById('err').style.display = 'flex'; }, true);
</script>
</body>
</html>
